# Đưa Bé Vui Học lên GitHub Pages mỗi khi có thay đổi trên nhánh main.
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Gộp CSS và JS vào một file index.html, để mỗi lần cập nhật trình duyệt không trộn file cũ với file mới
      - name: Gộp trang web thành một file
        run: node tools/build.js

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
