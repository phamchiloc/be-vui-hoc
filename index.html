<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bé Vui Học – Lớp 1 đến Lớp 5</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <button id="btnBack" class="icon-btn" title="Quay lại">⬅️</button>
    <a href="#/" class="brand">🎒 <span class="brand-text">Bé Vui Học</span></a>
    <div class="spacer"></div>
    <button id="btnKid" class="kid-btn" title="Bé đang học – bấm để đổi bé"><span class="kid-ic">👤</span><span class="kid-name">Chọn bé</span> ⭐ <span id="starTotal">0</span></button>
    <a id="btnGift" href="#/qua" class="icon-btn gift-btn" title="Quà của bé">🎁<i class="badge" hidden>0</i></a>
    <button id="btnSpeed" class="speed-btn" title="Tốc độ giọng đọc" aria-expanded="false" aria-controls="speedPanel">🗣️ <span>1x</span></button>
    <button id="btnSound" class="icon-btn" title="Bật/tắt âm thanh hiệu ứng">🔊</button>
    <div id="speedPanel" class="speed-panel" hidden></div>
  </header>

  <main id="app"></main>

  <div id="toast" class="toast"></div>
  <canvas id="confetti"></canvas>

  <script src="js/util.js"></script>
  <script src="js/data/tienganh-data.js"></script>
  <script src="js/data/doanvan-data.js"></script>
  <script src="js/data/colan-data.js"></script>
  <script src="js/qua.js"></script>
  <script src="js/quiz.js"></script>
  <script src="js/chepvan.js"></script>
  <script src="js/toan.js"></script>
  <script src="js/tienganh.js"></script>
  <script src="js/colan.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
